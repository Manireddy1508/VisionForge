name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    branches: [main]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT }}
      GCR_HOSTNAME: gcr.io

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Deploy Application
      run: |
        gcloud run deploy cloud-gen-app \
          --image ${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-app:${{ github.sha }} \
          --platform managed \
          --region us-central1 \
          --allow-unauthenticated \
          --set-env-vars="OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},OPENAI_IMAGE_MODEL=${{ secrets.OPENAI_IMAGE_MODEL }},MILVUS_HOST=${{ secrets.MILVUS_HOST }},MILVUS_PORT=${{ secrets.MILVUS_PORT }},GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}"

    - name: Get Service URL
      run: |
        echo "Application URL: $(gcloud run services describe cloud-gen-app --platform managed --region us-central1 --format 'value(status.url)')" >> $GITHUB_STEP_SUMMARY 