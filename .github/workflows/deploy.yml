name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    branches: [main]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Deploy Backend Service
      run: |
        gcloud run deploy cloud-gen-backend \
          --image ${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-backend:${{ github.sha }} \
          --platform managed \
          --region us-central1 \
          --allow-unauthenticated \
          --set-env-vars="OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},MILVUS_HOST=${{ secrets.MILVUS_HOST }},MILVUS_PORT=${{ secrets.MILVUS_PORT }},GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}"

    - name: Deploy Generator Service
      run: |
        gcloud run deploy cloud-gen-generator \
          --image ${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-generator:${{ github.sha }} \
          --platform managed \
          --region us-central1 \
          --allow-unauthenticated \
          --set-env-vars="OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},OPENAI_IMAGE_MODEL=${{ secrets.OPENAI_IMAGE_MODEL }},GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}"

    - name: Get Service URLs
      run: |
        echo "Backend Service URL: $(gcloud run services describe cloud-gen-backend --platform managed --region us-central1 --format 'value(status.url)')" >> $GITHUB_STEP_SUMMARY
        echo "Generator Service URL: $(gcloud run services describe cloud-gen-generator --platform managed --region us-central1 --format 'value(status.url)')" >> $GITHUB_STEP_SUMMARY 