name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend Service
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: cloud-gen-backend
          image: gcr.io/${{ secrets.GCP_PROJECT }}/cloud-gen-backend:${{ github.event.workflow_run.head_sha }}
          region: us-central1
          flags: '--allow-unauthenticated'
          env_vars: |
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_IMAGE_MODEL=${{ secrets.OPENAI_IMAGE_MODEL }}
            GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT }}
            MILVUS_HOST=${{ secrets.MILVUS_HOST }}
            MILVUS_PORT=${{ secrets.MILVUS_PORT }}
            GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}

      - name: Deploy Generator Service
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: cloud-gen-generator
          image: gcr.io/${{ secrets.GCP_PROJECT }}/cloud-gen-generator:${{ github.event.workflow_run.head_sha }}
          region: us-central1
          flags: '--allow-unauthenticated'
          env_vars: |
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_IMAGE_MODEL=${{ secrets.OPENAI_IMAGE_MODEL }}
            GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT }}
            MILVUS_HOST=${{ secrets.MILVUS_HOST }}
            MILVUS_PORT=${{ secrets.MILVUS_PORT }}
            GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}

      - name: Show Output
        run: |
          echo "Backend Service URL: $(gcloud run services describe cloud-gen-backend --platform managed --region us-central1 --format 'value(status.url)')"
          echo "Generator Service URL: $(gcloud run services describe cloud-gen-generator --platform managed --region us-central1 --format 'value(status.url)')" 