name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IMAGE_MODEL: ${{ secrets.OPENAI_IMAGE_MODEL }}
      MILVUS_HOST: ${{ secrets.MILVUS_HOST }}
      MILVUS_PORT: ${{ secrets.MILVUS_PORT }}
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for better versioning

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'  # Enable pip caching

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock pytest-asyncio pytest-xdist
        pip install black flake8 mypy
        pip install codecov

    - name: Verify environment variables
      run: |
        if [ -z "$OPENAI_API_KEY" ]; then
          echo "Error: OPENAI_API_KEY is not set"
          exit 1
        fi
        if [ -z "$OPENAI_IMAGE_MODEL" ]; then
          echo "Error: OPENAI_IMAGE_MODEL is not set"
          exit 1
        fi
        if [ -z "$MILVUS_HOST" ]; then
          echo "Error: MILVUS_HOST is not set"
          exit 1
        fi
        if [ -z "$GCP_PROJECT" ]; then
          echo "Error: GCP_PROJECT is not set"
          exit 1
        fi
        if [ -z "$GCS_BUCKET_NAME" ]; then
          echo "Error: GCS_BUCKET_NAME is not set"
          exit 1
        fi
        echo "All required environment variables are set"

    - name: Run linting
      run: |
        black --check src/ tests/
        flake8 src/ tests/
        mypy src/ tests/

    - name: Run tests with coverage
      run: |
        pytest tests/ \
          --cov=src/ \
          --cov-report=xml \
          --cov-report=term-missing \
          --cov-fail-under=80 \
          -v \
          --junitxml=test-results.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: true
        verbose: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          test-results.xml
          coverage.xml
        retention-days: 7 