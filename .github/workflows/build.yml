name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT }}
  GCR_HOSTNAME: gcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker ${{ env.GCR_HOSTNAME }}

    - name: Build and Push Image
      run: |
        docker build -t ${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-app:${{ github.sha }} -f Dockerfile .
        docker push ${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-app:${{ github.sha }}
        # Tag as latest for main branch
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          docker tag ${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-app:${{ github.sha }} ${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-app:latest
          docker push ${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-app:latest
        fi

    - name: Save Image Digest
      run: |
        echo "APP_IMAGE=${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-app:${{ github.sha }}" >> $GITHUB_ENV 