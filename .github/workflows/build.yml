name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT }}
  GCR_HOSTNAME: gcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker ${{ env.GCR_HOSTNAME }}

    - name: Build and Push Backend Image
      run: |
        docker build -t ${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-backend:${{ github.sha }} -f backend/Dockerfile .
        docker push ${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-backend:${{ github.sha }}
        # Tag as latest for main branch
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          docker tag ${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-backend:${{ github.sha }} ${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-backend:latest
          docker push ${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-backend:latest
        fi

    - name: Build and Push Generator Image
      run: |
        docker build -t ${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-generator:${{ github.sha }} -f generator/Dockerfile .
        docker push ${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-generator:${{ github.sha }}
        # Tag as latest for main branch
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          docker tag ${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-generator:${{ github.sha }} ${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-generator:latest
          docker push ${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-generator:latest
        fi

    - name: Save Image Digests
      run: |
        echo "BACKEND_IMAGE=${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-backend:${{ github.sha }}" >> $GITHUB_ENV
        echo "GENERATOR_IMAGE=${{ env.GCR_HOSTNAME }}/${{ env.PROJECT_ID }}/cloud-gen-generator:${{ github.sha }}" >> $GITHUB_ENV 