name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: gcr.io
  BACKEND_IMAGE_NAME: ${{ secrets.GCP_PROJECT }}/cloud-gen-backend
  GENERATOR_IMAGE_NAME: ${{ secrets.GCP_PROJECT }}/cloud-gen-generator

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Generator image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/generation
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.GENERATOR_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.GENERATOR_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max 