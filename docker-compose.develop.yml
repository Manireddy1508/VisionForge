version: '3.5'

services:
  etcd-dev:
    container_name: milvus-etcd-dev
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd-dev:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio-dev:
    container_name: milvus-minio-dev
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio-dev:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone-dev:
    container_name: milvus-standalone-dev
    image: milvusdb/milvus:v2.3.3
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd-dev:2379
      MINIO_ADDRESS: minio-dev:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus-dev:/var/lib/milvus
    ports:
      - "19531:19530"
      - "9092:9091"
    depends_on:
      - "etcd-dev"
      - "minio-dev"

  app-dev:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "7865:7860"
    environment:
      - MILVUS_HOST=standalone-dev
      - MILVUS_PORT=19530
      - OPENAI_API_KEY=${OPENAI_API_KEY_DEV}
      - OPENAI_IMAGE_MODEL=${OPENAI_IMAGE_MODEL_DEV}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT_DEV}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME_DEV}
      - PORT=7860
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - ENVIRONMENT=develop
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/input_images-dev:/app/input_images
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/output-dev:/app/output
    depends_on:
      - standalone-dev

  dashboard-dev:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "7862:7861"
    environment:
      - MILVUS_HOST=standalone-dev
      - MILVUS_PORT=19530
      - OPENAI_API_KEY=${OPENAI_API_KEY_DEV}
      - OPENAI_IMAGE_MODEL=${OPENAI_IMAGE_MODEL_DEV}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT_DEV}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME_DEV}
      - PORT=7861
      - ENVIRONMENT=develop
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/input_images-dev:/app/input_images
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/output-dev:/app/output
    command: streamlit run src/dashboard/app.py --server.port=7861 --server.address=0.0.0.0
    depends_on:
      - standalone-dev 